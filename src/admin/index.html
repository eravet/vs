<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Velo-Savvy editor</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- "New Journal post" opens a menu: Draft with AI (src/admin/draft/: Gemini + Openverse photos) or a blank post -->
  <style>
    a[href="#/collections/journal/new"]:not([role="menuitem"])::after { content: " ▾"; }
    .vs-new-menu { position: absolute; z-index: 10001; min-width: 260px; padding: 6px 0; border-radius: 6px; background: #fff;
      box-shadow: 0 6px 24px rgba(15, 23, 32, .22); font: 15px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vs-new-menu a { display: block; padding: 10px 16px; color: #1a1f26; text-decoration: none; }
    .vs-new-menu a:hover, .vs-new-menu a:focus { background: #eef4fb; outline: none; }
    .vs-new-menu small { display: block; margin-top: 2px; color: #59616d; font-size: 13px; }
  </style>
  <script>
    (function () {
      var NEW_POST = "#/collections/journal/new";
      var menu = null;

      function close() {
        if (menu) { menu.remove(); menu = null; }
      }

      function item(href, title, note) {
        var a = document.createElement("a");
        a.href = href;
        a.setAttribute("role", "menuitem");
        a.textContent = title;
        var small = document.createElement("small");
        small.textContent = note;
        a.appendChild(small);
        return a;
      }

      function open(button) {
        close();
        menu = document.createElement("div");
        menu.className = "vs-new-menu";
        menu.setAttribute("role", "menu");
        menu.appendChild(item("/admin/draft/", "✍️ Draft with AI", "Turn your notes into a draft, with a photo"));
        menu.appendChild(item(NEW_POST, "📝 Blank post", "Write it yourself"));
        document.body.appendChild(menu);
        var r = button.getBoundingClientRect();
        var maxLeft = document.documentElement.clientWidth - menu.offsetWidth - 8;
        menu.style.top = r.bottom + window.scrollY + 6 + "px";
        menu.style.left = Math.max(8, Math.min(r.left, maxLeft)) + window.scrollX + "px";
        menu.querySelector("a").focus();
      }

      // Capture phase, so this runs before the editor's own click handling.
      document.addEventListener("click", function (e) {
        if (menu && menu.contains(e.target)) { setTimeout(close); return; }
        var button = e.target.closest && e.target.closest('a[href="' + NEW_POST + '"]');
        if (!button || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) { close(); return; }
        e.preventDefault();
        e.stopPropagation();
        if (menu) close(); else open(button);
      }, true);
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
      window.addEventListener("resize", close);
      window.addEventListener("hashchange", close);
    })();
  </script>
  <script src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"></script>
  <script>
    // Posts preview with the real site styles
    CMS.registerPreviewStyle("/assets/css/main.css");
    CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap");
    var h = window.h || CMS.h;
    var PostPreview = createClass({
      render: function () {
        var entry = this.props.entry;
        var image = entry.getIn(["data", "image"]);
        var asset = image ? this.props.getAsset(image) : null;
        return h("article", { className: "post" },
          h("header", { className: "post__head" },
            h("div", { className: "wrap narrow" },
              h("p", { className: "eyebrow" }, "Journal · " + (entry.getIn(["data", "category"]) || "")),
              h("h1", { className: "post__title" }, entry.getIn(["data", "title"])),
              h("p", { className: "post__lede" }, entry.getIn(["data", "excerpt"]))
            )
          ),
          asset ? h("figure", { className: "post__hero wrap" }, h("img", { src: asset.toString(), alt: "" })) : null,
          h("div", { className: "wrap narrow prose prose--article" }, this.props.widgetFor("body"))
        );
      }
    });
    CMS.registerPreviewTemplate("journal", PostPreview);

    // Saving no longer puts changes on the site by itself (see "Go live" below), so the
    // editor's "Publish" buttons say "Save" instead.
    (function () {
      var en = CMS.getLocale && CMS.getLocale("en");
      var bar = en && en.editor && en.editor.editorToolbar;
      if (!bar) return;
      Object.assign(bar, {
        publish: "Save", publishing: "Saving…", published: "Saved", publishNow: "Save now",
        publishAndCreateNew: "Save and create new", publishAndDuplicate: "Save and duplicate"
      });
      CMS.registerLocale("en", en);
    })();
  </script>

  <!-- "Go live": saves pile up on GitHub; this puts them on the site in one deploy (netlify/functions/publish.mjs) -->
  <style>
    .vs-live { position: fixed; left: 20px; bottom: 20px; z-index: 10000; display: flex; align-items: center; gap: 10px;
      max-width: calc(100vw - 40px); padding: 8px 8px 8px 14px; border-radius: 999px; background: #fff; color: #1a1f26;
      box-shadow: 0 4px 18px rgba(15, 23, 32, .22); font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .vs-live[hidden] { display: none; }
    .vs-live .dot { width: 9px; height: 9px; flex: none; border-radius: 50%; background: #9aa3ad; }
    .vs-live[data-state="pending"] .dot { background: #e5482a; }
    .vs-live[data-state="live"] .dot { background: #1f9d55; }
    .vs-live[data-state="publishing"] .dot { background: #005fb8; animation: vs-pulse 1s infinite alternate; }
    .vs-live button { font: 600 14px/1 system-ui, sans-serif; padding: 8px 14px; border: 0; border-radius: 999px;
      background: #005fb8; color: #fff; cursor: pointer; }
    .vs-live button:hover { background: #004b92; }
    .vs-live button[hidden] { display: none; }
    @keyframes vs-pulse { to { opacity: .3; } }
  </style>
  <div class="vs-live" id="vs-live" role="status" hidden>
    <span class="dot" aria-hidden="true"></span>
    <span class="text" id="vs-live-text"></span>
    <button type="button" id="vs-live-go" hidden>Go live</button>
  </div>
  <script>
    (function () {
      var box = document.getElementById("vs-live");
      var text = document.getElementById("vs-live-text");
      var go = document.getElementById("vs-live-go");
      var repo = null;
      var publishing = null; // { target: commit, started: time }

      function token() {
        try {
          var u = JSON.parse(localStorage.getItem("decap-cms-user") || "null");
          return u && (u.token || u.access_token) || "";
        } catch (e) { return ""; }
      }

      function show(state, message, title, canGo) {
        box.hidden = false;
        box.dataset.state = state;
        text.textContent = message;
        box.title = title || "";
        go.hidden = !canGo;
      }

      function github(path) {
        return fetch("https://api.github.com/repos/" + repo + path, {
          headers: { authorization: "Bearer " + token(), accept: "application/vnd.github+json" },
          cache: "no-store"
        }).then(function (res) {
          if (!res.ok) throw new Error("GitHub " + res.status);
          return res.json();
        });
      }

      function liveCommit() {
        return fetch("/deploy-info.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (res) { return res.ok ? res.json() : {}; })
          .then(function (d) { return d.commit || ""; })
          .catch(function () { return ""; });
      }

      function check() {
        if (!repo || !token()) { box.hidden = true; return; }
        Promise.all([liveCommit(), github("/commits/main")]).then(function (r) {
          var live = r[0], head = r[1].sha;
          if (publishing) {
            if (live === publishing.target || live === head) {
              publishing = null;
              show("live", "Your changes are live", "", false);
            } else if (Date.now() - publishing.started > 10 * 60 * 1000) {
              publishing = null;
              show("pending", "The update is taking longer than usual. Check Deploys in Netlify.", "", true);
            } else {
              show("publishing", "Updating the site… about 2 minutes", "", false);
            }
            return;
          }
          if (live === head) { show("live", "Site is up to date", "", false); return; }
          if (!live) { show("pending", "Saved changes may not be live yet", "", true); return; }
          return github("/compare/" + live + "..." + head).then(function (c) {
            var list = (c.commits || []).map(function (x) { return "• " + x.commit.message.split("\n")[0]; });
            var n = c.ahead_by || list.length;
            show("pending", n === 1 ? "1 saved change isn't live yet" : n + " saved changes aren't live yet",
              "Waiting to go live:\n" + list.slice(-10).join("\n"), true);
          });
        }).catch(function () {
          show("pending", "Couldn't check what's live", "", true);
        });
      }

      go.addEventListener("click", function () {
        go.disabled = true;
        github("/commits/main").then(function (c) {
          return fetch("/api/publish", { method: "POST", headers: { authorization: "Bearer " + token() } })
            .then(function (res) {
              return res.json().catch(function () { return {}; }).then(function (d) {
                if (!res.ok) throw new Error(d.error || "Couldn't start the update (" + res.status + ").");
                publishing = { target: c.sha, started: Date.now() };
                show("publishing", "Updating the site… about 2 minutes", "", false);
              });
            });
        }).catch(function (err) {
          show("pending", err.message, "", true);
        }).then(function () { go.disabled = false; });
      });

      // The repo name comes from the editor's own settings, so it's only written down once.
      fetch("/admin/config.yml").then(function (r) { return r.text(); }).then(function (yml) {
        var m = /^\s*repo:\s*([\w.-]+\/[\w.-]+)/m.exec(yml);
        repo = m && m[1];
        check();
      });
      // Every 30 seconds (picks up new saves), or every 15 while an update is running.
      var ticks = 0;
      setInterval(function () {
        ticks++;
        if (!document.hidden && (publishing || ticks % 2 === 0)) check();
      }, 15000);
      window.addEventListener("hashchange", function () { setTimeout(check, 1500); });
      window.addEventListener("focus", check);
    })();
  </script>
</body>
</html>
