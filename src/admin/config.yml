# Velo-Savvy content editor (Decap CMS)
# Mark logs in at /admin/ with "Login with GitHub" (his GitHub account must be a collaborator on the repo).
# Netlify handles the GitHub sign-in (Project configuration > Access & security > OAuth). See docs/SETUP.md.
# Every "Save" (Decap's Publish button, relabelled in index.html) is a commit to GitHub. Saves don't
# deploy by themselves: "Go live" in the editor does (netlify.toml `ignore` + a build hook).
# Keep the commit messages below starting with Add/Update/Delete/Upload and a “ quote: that's how
# netlify.toml recognises editor saves (a test checks this).

backend:
  name: github
  repo: eravet/vs   # also set in netlify/lib/ai-draft.mjs (a test checks they match)
  branch: main
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

# Only used when the editor runs on localhost (run: PORT=8082 npx decap-server@3). Ignored on the live site.
local_backend:
  url: http://localhost:8082/api/v1

site_url: https://www.velo-savvy.com
display_url: https://www.velo-savvy.com
logo_url: /assets/brand/vs-logo.svg

media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  # ------------------------------------------------------------------
  # JOURNAL
  # ------------------------------------------------------------------
  - name: "journal"
    label: "Journal posts"
    label_singular: "Journal post"
    description: "Your weekly ride notes. Click '+ Journal post' to write one yourself, or to turn your notes into a draft with AI. Saved posts go live when you click 'Go live' (bottom left)."
    folder: "src/journal"
    extension: "md"
    format: "frontmatter"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title", "category"]
    view_filters:
      - { label: "Drafts", field: published, pattern: false }
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Date"
        name: "date"
        widget: "datetime"
        date_format: "MMM D, YYYY"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "Short summary"
        name: "excerpt"
        widget: "text"
        hint: "One or two sentences. Shown on the Journal page, on the homepage and in Google results."
      - label: "Topic"
        name: "category"
        widget: "select"
        default: "Training Tips"
        options: ["Training Tips", "Nutrition", "Recovery", "Mindset", "Race Strategy", "Equipment"]
      - label: "Main photo"
        name: "image"
        widget: "image"
        required: false
        choose_url: true
        hint: "A wide (landscape) photo works best. Leave empty to show the Velo-Savvy logo instead."
      - label: "Describe the photo"
        name: "image_alt"
        widget: "string"
        required: false
        hint: "A few words for people who can't see the image, e.g. 'Riders on a cobbled climb'."
      - label: "Photo credit"
        name: "image_credit"
        widget: "string"
        required: false
        hint: "Optional. e.g. Photo: [Jane Smith](https://unsplash.com/@janesmith). Links like [Jane Smith](https://...) work."
      - label: "Keywords"
        name: "tags"
        widget: "list"
        required: false
        hint: "Separate with commas, e.g. heat training, hydration"
      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Switch off to keep this post as a draft that doesn't show on the site."
      - label: "Post"
        name: "body"
        widget: "markdown"
        hint: "Use the toolbar for headings, bold, lists, links and photos."

  # ------------------------------------------------------------------
  # PAGES
  # ------------------------------------------------------------------
  - name: "pages"
    label: "Pages"
    description: "The words and photos on each page of the site."
    editor: { preview: false }
    files:
      # ---------------- Home ----------------
      - name: "home"
        label: "Home page"
        file: "src/_data/home.json"
        fields:
          - label: "Top banner"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Small line above the headline", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Intro text", name: "text", widget: "text" }
              - { label: "Main button text", name: "button", widget: "string" }
              - { label: "Second button text", name: "secondary_button", widget: "string" }
              - { label: "Background photo", name: "image", widget: "image", hint: "A wide, dark-ish photo works best so the white text stays readable." }
              - { label: "Describe the photo", name: "image_alt", widget: "string" }
          - label: "Highlights bar"
            name: "proof"
            widget: "list"
            hint: "The four short facts under the banner. Keep each one very short."
            summary: "{{fields.number}} · {{fields.label}}"
            fields:
              - { label: "Big text", name: "number", widget: "string" }
              - { label: "Small text", name: "label", widget: "string" }
          - label: "'Your coach' section"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "text", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [] }
              - { label: "Photo", name: "image", widget: "image", required: false, hint: "A portrait (taller than wide) photo. Leave empty to use the photo from the About page." }
              - { label: "Describe the photo", name: "image_alt", widget: "string", required: false }
          - { label: "'How it works' heading", name: "steps_heading", widget: "string" }
          - label: "'How it works' steps"
            name: "steps"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Step title", name: "title", widget: "string" }
              - { label: "Step text", name: "text", widget: "text" }
          - label: "Bottom call-to-action (shown on several pages)"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Button text", name: "button", widget: "string" }

      # ---------------- About ----------------
      - name: "about"
        label: "About Mark page"
        file: "src/_data/about.json"
        fields:
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Intro paragraph", name: "intro", widget: "text" }
          - { label: "Photo of Mark", name: "photo", widget: "image", hint: "A portrait (taller than wide) photo looks best. Also used under every Journal post." }
          - { label: "Describe the photo", name: "photo_alt", widget: "string" }
          - { label: "Your story", name: "story", widget: "markdown", buttons: ["bold", "italic", "link", "heading-three", "quote"], editor_components: [] }
          - { label: "Wide photo under your story", name: "band_image", widget: "image", required: false }
          - { label: "Describe the wide photo", name: "band_alt", widget: "string", required: false }
          - { label: "Caption on the wide photo", name: "band_caption", widget: "string", required: false }
          - { label: "Timeline heading", name: "timeline_heading", widget: "string" }
          - label: "Racing & coaching timeline"
            name: "timeline"
            widget: "list"
            hint: "Add a row for each period of your career. Drag rows to reorder."
            summary: "{{fields.year}} · {{fields.title}}"
            fields:
              - { label: "Year(s)", name: "year", widget: "string", hint: "e.g. 1994 or 1992–96" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Details", name: "text", widget: "text" }
          - { label: "Philosophy heading", name: "principles_heading", widget: "string" }
          - label: "Coaching philosophy"
            name: "principles"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

      # ---------------- Coaching ----------------
      - name: "coaching"
        label: "Coaching plans & prices"
        file: "src/_data/coaching.json"
        fields:
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - label: "Monthly plans"
            name: "plans"
            widget: "list"
            summary: "{{fields.name}} · ${{fields.price}}"
            hint: "Drag to reorder. Three plans looks best."
            fields:
              - { label: "Plan name", name: "name", widget: "string" }
              - { label: "Price (USD)", name: "price", widget: "number", value_type: "int", required: false, hint: "Leave empty to show 'Ask about pricing'." }
              - { label: "Per", name: "period", widget: "select", options: ["month", "week", "session"], default: "month" }
              - { label: "One-line description", name: "summary", widget: "string" }
              - { label: "Highlight this plan", name: "featured", widget: "boolean", default: false, hint: "Shows the plan in dark colours." }
              - { label: "Badge (optional)", name: "badge", widget: "string", required: false, hint: "e.g. Most popular" }
              - { label: "What's included", name: "features", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
          - { label: "Single sessions heading", name: "addons_heading", widget: "string" }
          - { label: "Single sessions intro", name: "addons_intro", widget: "string" }
          - label: "Single sessions"
            name: "addons"
            widget: "list"
            summary: "{{fields.name}} · ${{fields.price}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price (USD)", name: "price", widget: "number", value_type: "int", required: false }
              - { label: "Description", name: "text", widget: "text" }
          - { label: "FAQ heading", name: "faq_heading", widget: "string" }
          - label: "Frequently asked questions"
            name: "faq"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
          - label: "Referral offer"
            name: "referral"
            widget: "object"
            hint: "Shown on the Coaching page and the Athlete hub."
            fields:
              - { label: "Show the referral offer", name: "enabled", widget: "boolean", default: true }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "text", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [] }

      # ---------------- Camps & clinics ----------------
      - name: "programs"
        label: "Camps, clinics & training plans"
        file: "src/_data/programs.json"
        fields:
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Header photo", name: "image", widget: "image" }
          - { label: "Describe the photo", name: "image_alt", widget: "string" }
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "Clinics, camps, junior camp, ready-made plans. Each section has its own list of programs."
            fields:
              - { label: "Section title", name: "title", widget: "string" }
              - { label: "Short web address (no spaces)", name: "id", widget: "string", hint: "e.g. clinics. Used for the jump links at the top of the page." }
              - { label: "Section intro", name: "text", widget: "text" }
              - label: "Programs"
                name: "items"
                widget: "list"
                summary: "{{fields.name}} · {{fields.when}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Description", name: "detail", widget: "text" }
                  - { label: "When", name: "when", widget: "string", hint: "e.g. Saturday March 14, 8–11am or Dates announced soon" }
                  - { label: "Price", name: "price", widget: "string", required: false, hint: "e.g. $60. Leave empty to hide." }
                  - label: "Status"
                    name: "status"
                    widget: "select"
                    default: "coming-soon"
                    options:
                      - { label: "Coming soon (shows 'Tell me when it's on')", value: "coming-soon" }
                      - { label: "Open for booking (shows a 'Book a place' button)", value: "open" }
                      - { label: "Full", value: "full" }
                  - { label: "Booking link", name: "link", widget: "string", required: false, hint: "Where 'Book a place' goes when the status is Open: a TrainingPeaks plan, Stripe, BikeReg or similar link." }
          - { label: "Sign-up box heading", name: "interest_heading", widget: "string" }
          - { label: "Sign-up box text", name: "interest_text", widget: "text" }

      # ---------------- Juniors ----------------
      - name: "juniors"
        label: "Juniors team page"
        file: "src/_data/juniors.json"
        fields:
          - { label: "Small line above the headline", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Header photo", name: "image", widget: "image", hint: "Only use photos of junior riders with their parents' permission." }
          - { label: "Describe the photo", name: "image_alt", widget: "string" }
          - { label: "'About the team' heading", name: "about_heading", widget: "string" }
          - { label: "About the team", name: "about", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [] }
          - { label: "'What riders get' heading", name: "highlights_heading", widget: "string" }
          - label: "What riders get"
            name: "highlights"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Coaches heading", name: "coaches_heading", widget: "string" }
          - label: "Coaches"
            name: "coaches"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "About", name: "text", widget: "text" }
              - { label: "Photo", name: "photo", widget: "image", required: false }
          - { label: "Results heading", name: "results_heading", widget: "string" }
          - label: "Results"
            name: "results"
            widget: "list"
            summary: "{{fields.date}} · {{fields.result}}"
            hint: "The results section only appears once you add a result."
            fields:
              - { label: "Date", name: "date", widget: "string", hint: "e.g. Apr 2026" }
              - { label: "Result", name: "result", widget: "string", hint: "e.g. 1st, Junior 15–16" }
              - { label: "Race", name: "event", widget: "string" }
          - { label: "Parents section heading", name: "parents_heading", widget: "string" }
          - label: "Questions from parents"
            name: "parents"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
          - { label: "Join heading", name: "join_heading", widget: "string" }
          - { label: "Join text", name: "join_text", widget: "text" }
          - { label: "Club website link", name: "club_url", widget: "string", required: false }
          - { label: "Club email", name: "club_email", widget: "string", required: false }
          - { label: "Sponsors heading", name: "sponsors_heading", widget: "string" }
          - label: "Sponsors"
            name: "sponsors"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Website", name: "url", widget: "string", required: false }
              - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Leave empty to show the name instead." }
          - { label: "Sponsor invitation text", name: "sponsor_text", widget: "text" }

      # ---------------- Group rides ----------------
      - name: "rides"
        label: "Group rides"
        file: "src/_data/rides.json"
        fields:
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Header photo", name: "image", widget: "image" }
          - { label: "Describe the photo", name: "image_alt", widget: "string" }
          - { label: "Weekly rides heading", name: "weekly_heading", widget: "string" }
          - label: "Weekly rides"
            name: "weekly"
            widget: "list"
            summary: "{{fields.day}} {{fields.time}} · {{fields.name}}"
            fields:
              - { label: "Ride name", name: "name", widget: "string" }
              - { label: "Day", name: "day", widget: "string", hint: "e.g. Tuesdays" }
              - { label: "Time", name: "time", widget: "string", hint: "e.g. 6:45am" }
              - { label: "Meeting place", name: "place", widget: "string" }
              - { label: "Description", name: "text", widget: "string", required: false }
              - { label: "Link (Strava event, club page)", name: "link", widget: "string", required: false }
          - { label: "Special rides heading", name: "special_heading", widget: "string" }
          - label: "Special rides & events"
            name: "special"
            widget: "list"
            summary: "{{fields.date}} · {{fields.name}}"
            hint: "One-off rides like a Hugel prep ride. This section only appears when it has at least one ride. Delete rides once they're over."
            fields:
              - { label: "Ride name", name: "name", widget: "string" }
              - { label: "Date", name: "date", widget: "string", hint: "e.g. Sat Nov 1" }
              - { label: "Time", name: "time", widget: "string", required: false }
              - { label: "Meeting place", name: "place", widget: "string" }
              - { label: "Description", name: "text", widget: "string", required: false }
              - { label: "Link (Strava event)", name: "link", widget: "string", required: false }
          - { label: "Photo of you on a ride", name: "photo", widget: "image", required: false, hint: "Portrait (taller than wide). Leave empty to hide this section." }
          - { label: "Describe the photo", name: "photo_alt", widget: "string", required: false }
          - { label: "Photo section heading", name: "photo_heading", widget: "string", required: false }
          - { label: "Photo section text", name: "photo_text", widget: "text", required: false }
          - { label: "Strava club text", name: "strava_text", widget: "string" }

      # ---------------- Athlete hub ----------------
      - name: "athletes"
        label: "Athlete hub"
        file: "src/_data/athletes.json"
        fields:
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Intro", name: "intro", widget: "string" }
          - { label: "Links heading", name: "links_heading", widget: "string" }
          - { label: "TrainingPeaks login link", name: "trainingpeaks_url", widget: "string" }
          - { label: "Billing link (Stripe customer portal)", name: "billing_url", widget: "string", required: false, hint: "Leave empty to hide the Billing box." }
          - { label: "Coaching agreement / waiver link", name: "waiver_url", widget: "string", required: false, hint: "e.g. a DocuSign, Dropbox Sign or Google Form link. Leave empty to hide." }
          - { label: "Google review link", name: "review_url", widget: "string", required: false, hint: "From your Google Business Profile. Leave empty to hide." }
          - { label: "Resources heading", name: "resources_heading", widget: "string" }
          - label: "Guides & resources"
            name: "resources"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Short description", name: "text", widget: "string" }
              - { label: "Link", name: "link", widget: "string", hint: "A Journal post (e.g. /journal/...), a video or a PDF." }
          - { label: "Intake form heading", name: "intake_heading", widget: "string" }
          - { label: "Intake form text", name: "intake_text", widget: "text" }

      # ---------------- Testimonials ----------------
      - name: "testimonials"
        label: "Rider testimonials"
        file: "src/_data/testimonials.json"
        fields:
          - { label: "Section heading", name: "heading", widget: "string" }
          - label: "Testimonials"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            hint: "Only use real quotes from riders who said it's OK to publish them."
            fields:
              - { label: "Rider name", name: "name", widget: "string", hint: "First name and last initial is fine, e.g. Eric R." }
              - { label: "About the rider", name: "detail", widget: "string", required: false, hint: "e.g. Cat 3 racer, Austin" }
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Show on site", name: "show", widget: "boolean", default: true }

  # ------------------------------------------------------------------
  # SETTINGS
  # ------------------------------------------------------------------
  - name: "settings"
    label: "Settings"
    description: "Contact details, social links, site-wide text and the AI writing settings."
    editor: { preview: false }
    files:
      - name: "site"
        label: "Contact & site settings"
        file: "src/_data/site.json"
        fields:
          - { label: "Business name", name: "name", widget: "string" }
          - { label: "Coach name", name: "coach", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Site description (for Google)", name: "description", widget: "text", hint: "About 150 characters." }
          - { label: "Website address", name: "url", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string", required: false }
          - { label: "Booking link (optional)", name: "booking_url", widget: "string", required: false, hint: "Paste a Calendly or similar link to add a 'Pick a time' button on the Contact page." }
          - label: "Social links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "Strava club", name: "strava", widget: "string", required: false }
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "TrainingPeaks", name: "trainingpeaks", widget: "string", required: false }
          - label: "Newsletter signup"
            name: "newsletter"
            widget: "object"
            fields:
              - { label: "Show signup box", name: "enabled", widget: "boolean", default: true }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Image for link previews", name: "social_image", widget: "image", hint: "Shown when the site is shared on Facebook, iMessage, etc. 1200×630 works best." }
      - name: "ai_writing"
        label: "AI writing settings"
        file: "src/_data/ai_writing.json"
        fields:
          - label: "Writing instructions"
            name: "instructions"
            widget: "text"
            hint: "What 'Draft with AI' is told before it writes: your voice, structure, length and anything to avoid. Changes apply to the next draft; no rebuild needed."
          - label: "Posts to copy the style of"
            name: "example_posts"
            widget: "relation"
            collection: "journal"
            value_field: "{{slug}}"
            search_fields: ["title"]
            display_fields: ["title"]
            multiple: true
            min: 1
            max: 3
            hint: "Pick 1 to 3 of your best posts. The AI reads them to match your style."
          - label: "Photo search hints"
            name: "photo_hints"
            widget: "text"
            hint: "What kind of photos to look for, e.g. 'road cycling, no mountain bikes'. Photos come from Flickr and Wikimedia Commons via Openverse."
