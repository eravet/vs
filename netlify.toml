# Netlify build settings for Velo-Savvy
[build]
  command = "npm run build"
  publish = "_site"
  # Saves from the editor don't deploy by themselves (each deploy costs credits on the free plan).
  # Mark clicks "Go live" in the editor, which calls a build hook; hook builds always run.
  # Editor saves are recognised by their commit messages, e.g. Update journal “slug” (set in
  # src/admin/config.yml under commit_messages). Any other push, like a code change, deploys as usual.
  # Exit 0 = skip this build, exit 1 = build.
  ignore = "git log -1 --pretty=%s | grep -qE '^(Add|Update|Delete|Upload) .*“'"

[build.environment]
  NODE_VERSION = "22"

# Server code for the editor's "Draft with AI" page (needs GEMINI_API_KEY, set under
# Project configuration > Environment variables). See docs/SETUP.md.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep processed images between builds so publishing from the editor stays fast
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = [".cache", "_site/img"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Which commit is live; the editor's "Go live" button compares it with GitHub
[[headers]]
  for = "/deploy-info.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Old site addresses -> new ones
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/services.html"
  to = "/coaching/"
  status = 301
[[redirects]]
  from = "/services"
  to = "/coaching/"
  status = 301
[[redirects]]
  from = "/about.html"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301
[[redirects]]
  from = "/blog.html"
  to = "/journal/"
  status = 301
[[redirects]]
  from = "/blog"
  to = "/journal/"
  status = 301
[[redirects]]
  from = "/blog-post.html"
  to = "/journal/"
  status = 301
